name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: App (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libxdo-dev libssl-dev cmake clang
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib

  vulkan:
    # Variante Linux Vulkan : vérifie que whisper.cpp (shaders compris) compile et que les tests passent.
    name: App (ubuntu-22.04, Vulkan)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libxdo-dev libssl-dev cmake clang libvulkan-dev
      - name: Vulkan SDK (glslc et en-têtes récents ; glslc absent des dépôts Ubuntu 22.04)
        run: |
          V=1.4.341.1
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/vulkansdk.tar.xz" \
            "https://sdk.lunarg.com/sdk/download/$V/linux/vulkansdk-linux-x86_64-$V.tar.xz"
          tar -xJf "$RUNNER_TEMP/vulkansdk.tar.xz" -C "$RUNNER_TEMP" --wildcards \
            "$V/x86_64/bin/glslc" "$V/x86_64/include/*" "$V/x86_64/lib/libvulkan.so*"
          rm "$RUNNER_TEMP/vulkansdk.tar.xz"
          echo "VULKAN_SDK=$RUNNER_TEMP/$V/x86_64" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/$V/x86_64/bin" >> "$GITHUB_PATH"
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: vulkan
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: cargo clippy + test (sans GPU, repli processeur)
        working-directory: src-tauri
        run: |
          cargo clippy --all-targets --features vulkan -- -D warnings
          cargo test --lib --features vulkan -- --show-output

  linux-package:
    # Paquets .rpm / .deb de test pour chaque PR (artefact « murmure-linux-pr-N ») : à installer
    # sur une vraie machine (KDE Wayland…) avant de fusionner. Non signés pour la mise à jour auto.
    name: Paquet Linux de test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    env:
      # Binaire portable (pas de -march=native dans ggml), comme la release.
      SOURCE_DATE_EPOCH: "1700000000"
    steps:
      - uses: actions/checkout@v5
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libxdo-dev libssl-dev cmake clang rpm
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: linux-package
      - run: pnpm install --frozen-lockfile
      - name: Build (.deb, .rpm)
        # Pas de clé de signature en PR : artefacts de mise à jour désactivés.
        run: pnpm tauri build --bundles deb,rpm --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Rassembler
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/rpm/*.rpm src-tauri/target/release/bundle/deb/*.deb out/
          (cd out && sha256sum * > SHA256SUMS.txt)
          ls -lh out
          echo "### Paquets de test" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/    /' out/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: murmure-linux-pr-${{ github.event.pull_request.number }}
          path: out/
          retention-days: 30

  server:
    name: Serveur
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras --dev
      - run: uv run pytest -q
