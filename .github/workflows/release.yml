name: Release

# Pousser un tag vX.Y.Z (ou lancer à la main) :
#   1. construit les installeurs de toutes les plateformes ;
#   2. les publie sur S3 (lien public) et dans une release GitHub brouillon ;
#   3. met à jour la page de téléchargement, les liens « latest » et le manifeste
#      de mise à jour automatique (latest.json).
#
# Lien public : https://crgenerator.s3.eu-west-par.io.cloud.ovh.net/murmure/index.html
#
# macOS : signé Developer ID et notarisé si les secrets APPLE_* existent, sinon signature ad hoc.
#
# Déclenché uniquement par un tag poussé sur le dépôt d'origine (droits d'écriture requis).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}
  # Défini → ggml désactive -march=native : binaire portable (base AVX2/FMA/F16C en x86).
  SOURCE_DATE_EPOCH: "1700000000"
  S3_ENDPOINT: https://s3.eu-west-par.io.cloud.ovh.net
  S3_REGION: eu-west-par
  S3_BUCKET: crgenerator
  S3_PREFIX: murmure
  PUBLIC_BASE: https://crgenerator.s3.eu-west-par.io.cloud.ovh.net/murmure
  # OVH n'accepte pas les sommes de contrôle CRC par défaut des AWS CLI récents.
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

jobs:
  draft:
    name: Release brouillon
    # Un fork qui pousse un tag ne lance rien : tous les jobs dépendent de celui-ci.
    if: github.repository == 'RD-Agency/murmure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Créer la release GitHub si absente
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --title "Murmure $TAG" --target "$GITHUB_SHA" \
              --notes-file .github/release-notes.md

  build:
    needs: draft
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: '"macos-latest"'
            target: aarch64-apple-darwin
            suffix: macos-arm64
            features: ""
          - name: macOS Intel
            os: '"macos-15-intel"'
            target: x86_64-apple-darwin
            suffix: macos-x64
            features: ""
          - name: Linux
            os: '"ubuntu-22.04"'
            target: x86_64-unknown-linux-gnu
            suffix: linux-x64
            features: ""
          - name: Linux NVIDIA (CUDA)
            # Variable de repo CUDA_RUNNER = ["self-hosted","murmure-cuda"] → build sur la tour
            # (RTX 5060, 32 threads, cache persistant). Vide → runner GitHub (≈ 40 min).
            os: ${{ vars.CUDA_RUNNER || '"ubuntu-22.04"' }}
            target: x86_64-unknown-linux-gnu
            suffix: linux-x64-cuda
            features: cuda
          - name: Linux Vulkan
            # GPU NVIDIA, AMD ou Intel via le pilote graphique : rien d'embarqué, paquet léger.
            os: '"ubuntu-22.04"'
            target: x86_64-unknown-linux-gnu
            suffix: linux-x64-vulkan
            features: vulkan
          - name: Windows
            os: '"windows-latest"'
            target: x86_64-pc-windows-msvc
            suffix: windows-x64
            features: ""
    runs-on: ${{ fromJSON(matrix.os) }}
    env:
      SELF_HOSTED: ${{ contains(matrix.os, 'self-hosted') }}
      HAS_APPLE: ${{ secrets.APPLE_CERTIFICATE != '' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.OVH_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.OVH_S3_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Dépendances système (Linux)
        if: runner.os == 'Linux' && env.SELF_HOSTED != 'true'
        run: |
          sudo apt-get update
          # Ayatana (et non libappindicator3) : même dépendance que le build CUDA de la tour, et seul
          # paquet présent partout (Debian 12+, Ubuntu 22.04+, Fedora, openSUSE Leap 15.6/16, Tumbleweed).
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libxdo-dev libssl-dev cmake clang rpm ${{ matrix.features == 'vulkan' && 'libvulkan-dev' || '' }}

      - name: Vulkan SDK (glslc et en-têtes récents ; glslc absent des dépôts Ubuntu 22.04)
        if: matrix.features == 'vulkan'
        run: |
          V=1.4.341.1
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/vulkansdk.tar.xz" \
            "https://sdk.lunarg.com/sdk/download/$V/linux/vulkansdk-linux-x86_64-$V.tar.xz"
          tar -xJf "$RUNNER_TEMP/vulkansdk.tar.xz" -C "$RUNNER_TEMP" --wildcards \
            "$V/x86_64/bin/glslc" "$V/x86_64/include/*" "$V/x86_64/lib/libvulkan.so*"
          rm "$RUNNER_TEMP/vulkansdk.tar.xz"
          echo "VULKAN_SDK=$RUNNER_TEMP/$V/x86_64" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/$V/x86_64/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/$V/x86_64/bin/glslc" --version

      - name: CUDA toolkit (runner GitHub)
        if: matrix.features == 'cuda' && env.SELF_HOSTED != 'true'
        uses: Jimver/cuda-toolkit@v0.2.24
        with:
          # 12.9 comme sur la tour : cuBLAS ≥ 12.8 requis pour Blackwell (RTX 50, sm_120).
          cuda: "12.9.0"
          method: network
          sub-packages: '["nvcc", "cudart", "cudart-dev", "cccl"]'
          non-cuda-sub-packages: '["libcublas", "libcublas-dev"]'

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        if: env.SELF_HOSTED != 'true'
        with:
          workspaces: src-tauri
          key: ${{ matrix.suffix }}

      - name: Environnement de la tour (CUDA local, cache de compilation persistant)
        if: env.SELF_HOSTED == 'true'
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"   # aws CLI installé côté utilisateur
          echo "CUDA_PATH=/usr/local/cuda-12.9" >> "$GITHUB_ENV"
          # Sans ça, CMake prend /usr/bin/nvcc (CUDA 11 d'Ubuntu) qui ignore les RTX 40/50.
          echo "CMAKE_CUDA_COMPILER=/usr/local/cuda-12.9/bin/nvcc" >> "$GITHUB_ENV"
          echo "CUDACXX=/usr/local/cuda-12.9/bin/nvcc" >> "$GITHUB_ENV"
          # /usr/local/cuda pointe vers CUDA 13 sur la tour : on impose les bibliothèques 12.9 au lien.
          echo "MURMURE_CUDA_LIB_DIR=/usr/local/cuda-12.9/lib64" >> "$GITHUB_ENV"
          echo "/usr/local/cuda-12.9/bin" >> "$GITHUB_PATH"
          echo "CARGO_TARGET_DIR=$HOME/.cache/murmure-ci/target-${{ matrix.suffix }}" >> "$GITHUB_ENV"
          # CUDA 12.9 sait compiler pour Blackwell (RTX 50) en natif.
          echo "CMAKE_CUDA_ARCHITECTURES=75-real;86-real;89-real;120-real;120-virtual" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile

      - name: Version depuis le tag
        shell: bash
        run: |
          V="${TAG#v}"
          node -e "const f='src-tauri/tauri.conf.json',c=require('./'+f);c.version='$V';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"

      - name: Clé Apple de notarisation
        if: runner.os == 'macOS' && env.HAS_APPLE == 'true'
        run: echo "${{ secrets.APPLE_API_KEY_P8 }}" | base64 --decode > "$RUNNER_TEMP/apple_api_key.p8"

      - name: Build
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Architectures CUDA sur runner GitHub (toolkit 12.9) : Turing → Blackwell (RTX 50), PTX pour les suivantes.
          [ -z "$CMAKE_CUDA_ARCHITECTURES" ] && export CMAKE_CUDA_ARCHITECTURES="75-real;86-real;89-real;120-real;120-virtual"
          if [ -n "$APPLE_API_KEY" ] && [ -f "$RUNNER_TEMP/apple_api_key.p8" ]; then
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/apple_api_key.p8"
          fi
          # Sans certificat, Tauri échouerait sur des variables vides : on les retire.
          if [ -z "$APPLE_CERTIFICATE" ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY
          fi
          ARGS=(--target "${{ matrix.target }}")
          if [ "${{ matrix.features }}" = "cuda" ]; then
            # Variante CUDA : pas d'AppImage (linuxdeploy tente d'embarquer les bibliothèques du pilote NVIDIA).
            # Les bibliothèques CUDA 12 sont livrées dans le paquet (/usr/lib/murmure/cuda, rpath posé par
            # build.rs) : seul le pilote NVIDIA est requis, quelle que soit sa version CUDA (12 ou 13).
            # Manifeste de mise à jour dédié, pour ne jamais basculer vers la version sans GPU.
            LIBDIR="${MURMURE_CUDA_LIB_DIR:-$CUDA_PATH/lib64}"
            CUDALIBS="$RUNNER_TEMP/cuda-libs"; mkdir -p "$CUDALIBS"
            for l in libcudart.so.12 libcublas.so.12 libcublasLt.so.12; do cp -L "$LIBDIR/$l" "$CUDALIBS/$l"; done
            ls -lh "$CUDALIBS"
            python3 - "$CUDALIBS" "$PUBLIC_BASE/cuda/latest.json" > "$RUNNER_TEMP/cuda.conf.json" <<'PY'
          import json, os, sys
          d, endpoint = sys.argv[1], sys.argv[2]
          files = {f"/usr/lib/murmure/cuda/{n}": os.path.join(d, n) for n in sorted(os.listdir(d))}
          print(json.dumps({
              "bundle": {"linux": {"deb": {"files": files}, "rpm": {"files": files}}},
              "plugins": {"updater": {"endpoints": [endpoint]}},
          }))
          PY
            cat "$RUNNER_TEMP/cuda.conf.json"
            ARGS+=(--features cuda --bundles deb,rpm --config "$RUNNER_TEMP/cuda.conf.json")
          elif [ "${{ matrix.features }}" = "vulkan" ]; then
            # Variante Vulkan : seul libvulkan.so.1 (+ le pilote ICD du GPU) est requis à l'exécution ;
            # sans périphérique Vulkan, whisper.cpp se replie sur le processeur. Dépendance deb libvulkan1 ;
            # côté rpm, dépendance par fichier car le paquet change de nom (libvulkan1 sur openSUSE,
            # vulkan-loader sur Fedora). Pas d'AppImage. Manifeste de mise à jour dédié vulkan/latest.json.
            python3 - "$PUBLIC_BASE/vulkan/latest.json" > "$RUNNER_TEMP/vulkan.conf.json" <<'PY'
          import json, sys
          linux = json.load(open("src-tauri/tauri.conf.json"))["bundle"].get("linux", {})
          deps = lambda fmt: linux.get(fmt, {}).get("depends", [])
          print(json.dumps({
              "bundle": {"linux": {
                  "deb": {"depends": deps("deb") + ["libvulkan1"]},
                  "rpm": {"depends": deps("rpm") + ["libvulkan.so.1()(64bit)"]},
              }},
              "plugins": {"updater": {"endpoints": [sys.argv[1]]}},
          }))
          PY
            cat "$RUNNER_TEMP/vulkan.conf.json"
            ARGS+=(--features vulkan --bundles deb,rpm --config "$RUNNER_TEMP/vulkan.conf.json")
          elif [ "${{ matrix.suffix }}" = "linux-x64" ]; then
            # AppImage : le webkit2gtk embarqué (Ubuntu 22.04) exige FreeType ≥ 2.11, que linuxdeploy n'embarque
            # pas ; openSUSE Leap 15.6 n'a que la 2.10 (symbole FT_Get_Color_Glyph_Paint absent). On l'ajoute.
            echo '{"bundle":{"linux":{"appimage":{"files":{"/usr/lib/libfreetype.so.6":"/usr/lib/x86_64-linux-gnu/libfreetype.so.6"}}}}}' \
              > "$RUNNER_TEMP/appimage.conf.json"
            ARGS+=(--config "$RUNNER_TEMP/appimage.conf.json")
          fi
          pnpm tauri build "${ARGS[@]}"

      - name: Rassembler les installeurs
        shell: bash
        run: |
          V="${TAG#v}"; S="${{ matrix.suffix }}"
          B="${CARGO_TARGET_DIR:-src-tauri/target}/${{ matrix.target }}/release/bundle"
          mkdir -p out
          shopt -s nullglob
          cp_one() { cp "$1" "out/$2"; [ -f "$1.sig" ] && cp "$1.sig" "out/$2.sig"; true; }
          for f in "$B"/dmg/*.dmg;               do cp_one "$f" "Murmure-$V-$S.dmg"; done
          for f in "$B"/macos/*.app.tar.gz;      do cp_one "$f" "Murmure-$V-$S.app.tar.gz"; done
          for f in "$B"/deb/*.deb;               do cp_one "$f" "Murmure-$V-$S.deb"; done
          for f in "$B"/rpm/*.rpm;               do cp_one "$f" "Murmure-$V-$S.rpm"; done
          for f in "$B"/appimage/*.AppImage;     do cp_one "$f" "Murmure-$V-$S.AppImage"; done
          for f in "$B"/msi/*.msi;               do cp_one "$f" "Murmure-$V-$S.msi"; done
          for f in "$B"/nsis/*-setup.exe;        do cp_one "$f" "Murmure-$V-$S-setup.exe"; done
          ls -lh out
          test -n "$(ls out)"

      - name: Publier sur S3
        shell: bash
        run: |
          for f in out/*; do
            aws s3 cp "$f" "s3://$S3_BUCKET/$S3_PREFIX/releases/$TAG/$(basename "$f")" \
              --endpoint-url "$S3_ENDPOINT" --region "$S3_REGION" --acl public-read --only-show-errors
          done

      - name: Publier sur la release GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" out/* --clobber

  publish:
    needs: build
    # Publie même si une variante a échoué : les autres plateformes restent disponibles.
    if: ${{ !cancelled() && github.repository == 'RD-Agency/murmure' }}
    name: Page de téléchargement et mise à jour auto
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.OVH_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.OVH_S3_SECRET_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Récupérer les fichiers publiés
        run: |
          aws s3 cp "s3://$S3_BUCKET/$S3_PREFIX/releases/$TAG/" dl/ --recursive \
            --endpoint-url "$S3_ENDPOINT" --region "$S3_REGION" --only-show-errors
          ls -lh dl

      - name: Sommes de contrôle, latest.json, page
        run: |
          (cd dl && sha256sum $(ls | grep -v '\.sig$' | grep -v SHA256SUMS) > SHA256SUMS.txt && cat SHA256SUMS.txt)
          python3 .github/scripts/publish.py --dir dl --tag "$TAG" --base "$PUBLIC_BASE" --out site
          ls -l site

      - name: Envoyer sur S3
        run: |
          s3() { aws s3 cp "$@" --endpoint-url "$S3_ENDPOINT" --region "$S3_REGION" --acl public-read --only-show-errors; }
          s3 dl/SHA256SUMS.txt "s3://$S3_BUCKET/$S3_PREFIX/releases/$TAG/SHA256SUMS.txt"
          # Liens stables sans numéro de version. Envoi depuis les fichiers locaux : la copie
          # serveur à serveur échoue chez OVH sur les objets multipart (ETag inattendu).
          while read -r src dst; do
            s3 "dl/$src" "s3://$S3_BUCKET/$S3_PREFIX/latest/$dst"
          done < site/latest-map.txt
          s3 site/latest.json "s3://$S3_BUCKET/$S3_PREFIX/latest.json" --cache-control "no-cache" --content-type application/json
          for v in cuda vulkan; do
            if [ -f "site/$v/latest.json" ]; then
              s3 "site/$v/latest.json" "s3://$S3_BUCKET/$S3_PREFIX/$v/latest.json" --cache-control "no-cache" --content-type application/json
            fi
          done
          s3 site/index.html  "s3://$S3_BUCKET/$S3_PREFIX/index.html"  --cache-control "no-cache" --content-type "text/html; charset=utf-8"
          s3 site/icon.png    "s3://$S3_BUCKET/$S3_PREFIX/icon.png"

      - name: SHA256SUMS sur la release GitHub
        run: gh release upload "$TAG" dl/SHA256SUMS.txt --clobber

      - name: Résumé
        run: |
          {
            echo "### Murmure $TAG publié"
            echo
            echo "- Page de téléchargement : $PUBLIC_BASE/index.html"
            echo "- Manifeste de mise à jour : $PUBLIC_BASE/latest.json"
            echo
            sed 's/^/    /' site/latest-map.txt
          } >> "$GITHUB_STEP_SUMMARY"
