[env]
# Instructions SIMD de ggml dans les builds portables (CI) : voir cmake/ggml-x86-64-v3.cmake.
CMAKE_PROJECT_INCLUDE_BEFORE = { value = "cmake/ggml-x86-64-v3.cmake", relative = true }
# libopus (audio de l'historique) compilée depuis les sources embarquées par audiopus_sys et liée
# statiquement : jamais la bibliothèque du système, même si pkg-config la trouve.
LIBOPUS_NO_PKG = "1"
# Les sources d'opus 1.3 demandent CMake 3.1, refusé tel quel par CMake 4.
CMAKE_POLICY_VERSION_MINIMUM = "3.5"
