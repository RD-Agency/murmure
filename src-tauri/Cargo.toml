[package]
name = "murmure"
version = "0.1.6"
description = "Murmure — dictée vocale locale ou serveur"
authors = ["RD Agency"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/RD-Agency/murmure"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "murmure_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
# Accélération GPU du moteur local (Linux/Windows), une seule à la fois :
#   cuda   : NVIDIA uniquement, CUDA Toolkit au build, bibliothèques CUDA livrées avec le paquet ;
#   vulkan : NVIDIA, AMD, Intel ; au build libvulkan-dev + glslc, à l'exécution libvulkan.so.1 + pilote.
# Sans GPU utilisable à l'exécution, whisper.cpp se replie sur le processeur.
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
once_cell = "1"
regex = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls"] }
cpal = "0.15"
hound = "3.5"
rubato = "0.16"
whisper-rs = { version = "0.15", features = ["raw-api", "log_backend"] }
arboard = "3"
enigo = "0.5"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
sha2 = "0.10"
fs4 = "1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# Wayland : raccourci global (GlobalShortcuts) et collage (RemoteDesktop) via les portails XDG.
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts", "remote_desktop", "screencast", "notification"] }
# Presse-papiers Wayland natif (wlr-data-control / ext-data-control) ; repli X11 automatique.
arboard = { version = "3", features = ["wayland-data-control"] }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.15", features = ["metal", "raw-api", "log_backend"] }
# Permissions (AVFoundation) et réglages fins de la fenêtre overlay (NSWindow)
objc2 = "0.6"
block2 = "0.6"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
